<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-labelledby="titre description">
  <title id="titre">Panneau additionnel A0b — distance du danger</title>
  <desc id="description">Panneau bleu à texte blanc : le danger annoncé se trouve à 500 mètres.</desc>
  <rect x="8" y="8" width="464" height="224" rx="12" fill="#005baa" stroke="#ffffff" stroke-width="10"/>
  <text x="240" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" fill="#ffffff">500 m</text>
</svg>
