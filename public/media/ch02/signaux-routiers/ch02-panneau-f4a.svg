<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="titre description">
  <title id="titre">Panneau F4a — zone à vitesse limitée à 30 km/h</title>
  <desc id="description">Rectangle blanc portant ZONE et un disque 30 km : la vitesse est limitée à 30 km/h dans toute la zone jusqu'au panneau de fin.</desc>
  <rect x="54" y="108" width="372" height="264" rx="8" fill="#ffffff" stroke="#111827" stroke-width="8"/>
  <text x="240" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" fill="#111827">ZONE</text>
  <circle cx="240" cy="276" r="64" fill="#ffffff" stroke="#d21f2b" stroke-width="16"/>
  <text x="240" y="288" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#111827">30</text>
  <text x="240" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111827">km</text>
</svg>
