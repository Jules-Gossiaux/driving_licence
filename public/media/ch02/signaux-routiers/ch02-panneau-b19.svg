<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="titre description">
  <title id="titre">Panneau B19 — passage étroit, cédez le passage</title>
  <desc id="description">Cercle à bord rouge : le passage est trop étroit pour se croiser, le conducteur doit céder le passage aux usagers venant en sens opposé.</desc>
