<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="titre agents">
  <title id="titre">Les trois positions de l'agent qualifié et leurs équivalents lumineux</title>
  <desc id="agents">De profil, l'agent équivaut au feu vert. Bras levé, il équivaut au feu orange. De face ou de dos, il équivaut au feu rouge.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Obéir aux positions de l'agent</text>
  <text x="40" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Les gestes de l'agent qualifié priment sur les feux et la signalisation.</text>

  <g>
    <rect x="40" y="108" width="280" height="380" rx="18" fill="#ffffff" stroke="#a7f3d0"/>
    <rect x="40" y="108" width="280" height="8" rx="4" fill="#16a34a"/>
    <text x="60" y="148" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent de profil</text>
    <text x="60" y="180" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#15803d">= FEU VERT</text>

    <circle cx="140" cy="232" r="16" fill="#f1c7a5"/>
    <path d="M124 226h34" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <rect x="130" y="214" width="22" height="9" rx="3" fill="#1e3a8a"/>
    <path d="M140 248v38" stroke="#1d4ed8" stroke-width="18" stroke-linecap="round"/>
    <path d="M140 258l-18 20" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round"/>
    <path d="M140 286l-12 32m12-32l12 32" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>

    <rect x="242" y="190" width="26" height="72" rx="6" fill="#1f2937"/>
    <circle cx="255" cy="205" r="7" fill="#16a34a"/>
    <circle cx="255" cy="226" r="7" fill="#374151"/>
    <circle cx="255" cy="247" r="7" fill="#374151"/>

    <text x="60" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Vous êtes autorisé à passer :</text>
    <text x="60" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">tout droit, à gauche ou à droite.</text>
    <text x="60" y="416" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">Position vue de côté.</text>
  </g>

  <g>
    <rect x="340" y="108" width="280" height="380" rx="18" fill="#ffffff" stroke="#fde68a"/>
    <rect x="340" y="108" width="280" height="8" rx="4" fill="#f59e0b"/>
    <text x="360" y="148" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent au bras levé</text>
    <text x="360" y="180" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#b45309">= FEU ORANGE</text>

    <circle cx="440" cy="232" r="16" fill="#f1c7a5"/>
    <path d="M424 224h32" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <rect x="430" y="214" width="22" height="9" rx="3" fill="#1e3a8a"/>
    <path d="M440 248v38" stroke="#1d4ed8" stroke-width="18" stroke-linecap="round"/>
    <path d="M432 252v-56" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round"/>
    <path d="M448 256v22" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round"/>
    <path d="M436 286l-8 32m20-32l8 32" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>

    <rect x="542" y="190" width="26" height="72" rx="6" fill="#1f2937"/>
    <circle cx="555" cy="205" r="7" fill="#374151"/>
    <circle cx="555" cy="226" r="7" fill="#f59e0b"/>
    <circle cx="555" cy="247" r="7" fill="#374151"/>

    <text x="360" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Arrêt dans toutes les directions.</text>
    <text x="360" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Ne pas s'engager dans le carrefour.</text>
    <text x="360" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Si vous y êtes déjà, dégagez-le.</text>
  </g>

  <g>
    <rect x="640" y="108" width="280" height="380" rx="18" fill="#ffffff" stroke="#fecaca"/>
    <rect x="640" y="108" width="280" height="8" rx="4" fill="#dc2626"/>
    <text x="660" y="148" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent de face ou de dos</text>
    <text x="660" y="180" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#b91c1c">= FEU ROUGE</text>

    <circle cx="740" cy="232" r="16" fill="#f1c7a5"/>
    <path d="M724 224h32" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <rect x="730" y="214" width="22" height="9" rx="3" fill="#1e3a8a"/>
    <path d="M740 248v38" stroke="#1d4ed8" stroke-width="18" stroke-linecap="round"/>
    <path d="M732 256h-42m58 0h42" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round"/>
    <path d="M736 286l-8 32m20-32l8 32" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>

    <rect x="842" y="190" width="26" height="72" rx="6" fill="#1f2937"/>
    <circle cx="855" cy="205" r="7" fill="#374151"/>
    <circle cx="855" cy="226" r="7" fill="#374151"/>
    <circle cx="855" cy="247" r="7" fill="#dc2626"/>

    <text x="660" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Arrêt obligatoire, même pour</text>
    <text x="660" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">tourner à droite.</text>
    <text x="660" y="416" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">De face ou de dos, avec ou sans</text>
    <text x="660" y="436" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">bras tendus : toujours l'arrêt.</text>
  </g>
</svg>
