<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="titre sanctions">
  <title id="titre">Le parcours d'une amende impayée</title>
  <desc id="sanctions">Perception immédiate par l'agent, puis transaction, ordre de paiement et enfin suspension du permis après trois ans, toutes décidées par le procureur du Roi.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="30" y="50" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Payer, ou laisser filer : les étapes</text>
  <text x="30" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Une amende non payée ne disparaît pas : elle peut finir en suspension du droit de conduire.</text>

  <g>
    <rect x="30" y="132" width="200" height="180" rx="16" fill="#ffffff" stroke="#a7f3d0"/>
    <rect x="30" y="132" width="200" height="8" rx="4" fill="#0f766e"/>
    <text x="50" y="174" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Perception</text>
    <text x="50" y="196" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">immédiate</text>
    <text x="50" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f766e">Décidée par l'agent</text>
    <text x="50" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">Sur place ou par</text>
    <text x="50" y="274" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">virement bancaire.</text>
    <text x="50" y="298" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b45309">La formule la moins chère.</text>
  </g>

  <path d="M232 222h22m0 0-7-7m7 7-7 7" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <text x="232" y="204" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">non payée</text>

  <g>
    <rect x="260" y="132" width="200" height="180" rx="16" fill="#ffffff" stroke="#fde68a"/>
    <rect x="260" y="132" width="200" height="8" rx="4" fill="#d97706"/>
    <text x="280" y="174" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Transaction</text>
    <text x="280" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#b45309">Décidée par le procureur</text>
    <text x="280" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">Proposée si la perception</text>
    <text x="280" y="274" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">immédiate n'a pas été payée.</text>
    <text x="280" y="298" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">Le montant est plus élevé.</text>
  </g>

  <path d="M462 222h22m0 0-7-7m7 7-7 7" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <text x="462" y="204" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">non payée</text>

  <g>
    <rect x="490" y="132" width="200" height="180" rx="16" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="490" y="132" width="200" height="8" rx="4" fill="#ea580c"/>
    <text x="510" y="174" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Ordre de paiement</text>
    <text x="510" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#c2410c">Décidé par le procureur</text>
    <text x="510" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">L'administration est chargée</text>
    <text x="510" y="274" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">de recouvrer la somme.</text>
    <text x="510" y="298" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b91c1c">Le véhicule peut être saisi.</text>
  </g>

  <path d="M692 222h22m0 0-7-7m7 7-7 7" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <text x="692" y="204" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">3 ans</text>

  <g>
    <rect x="720" y="132" width="210" height="180" rx="16" fill="#ffffff" stroke="#fecaca"/>
    <rect x="720" y="132" width="210" height="8" rx="4" fill="#dc2626"/>
    <text x="740" y="174" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Suspension</text>
    <text x="740" y="196" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">du permis</text>
    <text x="740" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Décidée par le procureur</text>
    <text x="740" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">Après 3 ans sans paiement :</text>
    <text x="740" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">8 jours, 15 jours ou 1 mois</text>
    <text x="740" y="298" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">selon la gravité.</text>
  </g>

  <rect x="30" y="356" width="900" height="78" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="54" y="386" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a">À ne pas confondre</text>
  <text x="54" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">La suspension pour non-paiement est décidée par le procureur du Roi. La déchéance du droit de conduire est décidée par un juge.</text>

  <rect x="30" y="456" width="900" height="44" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="54" y="483" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#065f46">Payer immédiatement est donc la solution la plus simple et la moins coûteuse.</text>
</svg>
