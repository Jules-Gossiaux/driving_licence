<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="titre particuliers">
  <title id="titre">Flèches tricolores, silhouette de bicyclette et silhouette entourée de flèches</title>
  <desc id="particuliers">Une flèche a la même couleur qu'un feu mais limite son effet à la direction indiquée. La silhouette de bicyclette ne concerne que les cyclistes et les cyclomoteurs à deux roues. Entourée de flèches, elle autorise ces usagers sur la piste cyclable dans toutes les directions indiquées.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Flèches et silhouettes</text>
  <text x="40" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">La couleur garde son sens, mais l'effet est limité à une direction ou à une catégorie d'usagers.</text>

  <g>
    <rect x="40" y="108" width="280" height="344" rx="18" fill="#ffffff" stroke="#fde68a"/>
    <rect x="40" y="108" width="280" height="8" rx="4" fill="#f59e0b"/>
    <text x="62" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Flèche tricolore</text>
    <text x="62" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b45309">Une direction, une couleur</text>

    <g transform="translate(90 245)">
      <path d="M20 0L-8 24L-8 10L-32 10L-32-10L-8-10L-8-24Z" fill="#dc2626"/>
    </g>
    <g transform="translate(145 245)">
      <path d="M20 0L-8 24L-8 10L-32 10L-32-10L-8-10L-8-24Z" fill="#f59e0b"/>
    </g>
    <g transform="translate(200 245)">
      <path d="M20 0L-8 24L-8 10L-32 10L-32-10L-8-10L-8-24Z" fill="#16a34a"/>
    </g>
    <text x="75" y="288" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">rouge</text>
    <text x="130" y="288" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">orange</text>
    <text x="185" y="288" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">vert</text>

    <text x="62" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Même sens que le cercle</text>
    <text x="62" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">de même couleur, mais</text>
    <text x="62" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">direction limitée.</text>
    <text x="62" y="414" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">La flèche rouge interdit la</text>
    <text x="62" y="432" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">direction qu'elle indique.</text>
  </g>

  <g>
    <rect x="340" y="108" width="280" height="344" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="340" y="108" width="280" height="8" rx="4" fill="#16a34a"/>
    <text x="362" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Silhouette vélo</text>
    <text x="362" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#15803d">Un feu réservé</text>

    <rect x="452" y="196" width="56" height="150" rx="10" fill="#1f2937"/>
    <rect x="458" y="202" width="44" height="138" rx="6" fill="#111827"/>
    <circle cx="480" cy="225" r="14" fill="#374151"/>
    <circle cx="480" cy="305" r="14" fill="#052e16" stroke="#166534" stroke-width="2"/>
    <g stroke="#22c55e" stroke-width="2" stroke-linecap="round" fill="none">
      <circle cx="474" cy="308" r="4"/>
      <circle cx="487" cy="308" r="4"/>
      <path d="M474 308l5-7h6l-1 7"/>
      <path d="M479 301l2 7"/>
    </g>

    <text x="362" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Cyclistes et</text>
    <text x="362" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">cyclomoteurs à deux</text>
    <text x="362" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">roues uniquement.</text>
    <text x="362" y="444" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">Les voitures ne suivent pas ce feu.</text>
  </g>

  <g>
    <rect x="640" y="108" width="280" height="344" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="640" y="108" width="280" height="8" rx="4" fill="#16a34a"/>
    <text x="662" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Vélo entouré de flèches</text>
    <text x="662" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#15803d">Toutes les directions</text>

    <circle cx="820" cy="245" r="58" fill="#052e16" stroke="#166534" stroke-width="3"/>
    <g stroke="#22c55e" stroke-width="5" stroke-linecap="round" fill="none">
      <circle cx="798" cy="258" r="12"/>
      <circle cx="842" cy="258" r="12"/>
      <path d="M798 258l18-24h26l-4 24"/>
      <path d="M816 234l8 24"/>
      <path d="M810 231h12"/>
      <path d="M838 230l10 8"/>
    </g>
    <g fill="#22c55e">
      <path d="M820 162l12 20h-24z"/>
      <path d="M820 328l-12-20h24z"/>
      <path d="M737 245l20-12v24z"/>
      <path d="M903 245l-20 12v-24z"/>
    </g>

    <text x="662" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Piste cyclable : toutes</text>
    <text x="662" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">les directions indiquées,</text>
    <text x="662" y="426" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">pour cyclistes et</text>
    <text x="662" y="448" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">cyclomoteurs à deux roues.</text>
  </g>

  <text x="40" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">La silhouette de bicyclette ne concerne que les cyclistes et les cyclomoteurs à deux roues.</text>
</svg>
