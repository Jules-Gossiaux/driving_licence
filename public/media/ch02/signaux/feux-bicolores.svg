<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="titre bicolores">
  <title id="titre">Les feux bicolores pour piétons et le signal combiné vélo-piéton</title>
  <desc id="bicolores">Le piéton rouge interdit de s'engager sur la chaussée. Le piéton vert l'autorise. Le vert clignotant annonce la fin de l'autorisation. Le signal combiné vélo et piéton ne s'adresse qu'aux cyclistes, aux cyclomoteurs à deux roues autorisés sur la piste cyclable et aux piétons.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Les feux bicolores</text>
  <text x="40" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Deux couleurs, des usagers précis : le rouge est toujours au-dessus du vert.</text>

  <g>
    <rect x="40" y="108" width="280" height="344" rx="18" fill="#ffffff" stroke="#fecaca"/>
    <rect x="40" y="108" width="280" height="8" rx="4" fill="#dc2626"/>
    <text x="62" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Piéton rouge</text>
    <text x="62" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b91c1c">Piéton immobile</text>

    <rect x="148" y="185" width="64" height="170" rx="12" fill="#1f2937"/>
    <rect x="154" y="191" width="52" height="158" rx="8" fill="#111827"/>
    <circle cx="180" cy="220" r="24" fill="#052e16" stroke="#7f1d1d" stroke-width="2"/>
    <g stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" fill="none">
      <circle cx="180" cy="210" r="3.5" fill="#dc2626" stroke="none"/>
      <path d="M180 215v11"/>
      <path d="M180 218l-5 5m5-5l5 5"/>
      <path d="M180 226l-3 6m3-6l3 6"/>
    </g>
    <circle cx="180" cy="310" r="24" fill="#111827"/>

    <text x="62" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Ne pas s'engager</text>
    <text x="62" y="408" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">sur la chaussée.</text>
    <text x="62" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">Le piéton attend sur le trottoir.</text>
  </g>

  <g>
    <rect x="340" y="108" width="280" height="344" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="340" y="108" width="280" height="8" rx="4" fill="#16a34a"/>
    <text x="362" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Piéton vert</text>
    <text x="362" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#15803d">Piéton en marche</text>

    <rect x="448" y="185" width="64" height="170" rx="12" fill="#1f2937"/>
    <rect x="454" y="191" width="52" height="158" rx="8" fill="#111827"/>
    <circle cx="480" cy="220" r="24" fill="#111827"/>
    <circle cx="480" cy="310" r="24" fill="#052e16" stroke="#166534" stroke-width="2"/>
    <g stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" fill="none">
      <circle cx="480" cy="298" r="3.5" fill="#22c55e" stroke="none"/>
      <path d="M480 303v13"/>
      <path d="M480 307l-6 5m6-5l6 3"/>
      <path d="M480 316l-6 11m6-11l7 9"/>
    </g>

    <text x="362" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">S'engager autorisé.</text>
    <text x="362" y="398" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Vert clignotant :</text>
    <text x="362" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">fin indicative de</text>
    <text x="362" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">l'autorisation.</text>
  </g>

  <g>
    <rect x="640" y="108" width="280" height="344" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="640" y="108" width="280" height="8" rx="4" fill="#16a34a"/>
    <text x="662" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Vélo + piéton</text>
    <text x="662" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#15803d">Un seul signal, trois usagers</text>

    <rect x="715" y="195" width="130" height="120" rx="16" fill="#1f2937"/>
    <rect x="723" y="203" width="114" height="104" rx="10" fill="#052e16" stroke="#166534" stroke-width="2"/>
    <g stroke="#22c55e" stroke-width="4" stroke-linecap="round" fill="none">
      <circle cx="752" cy="267" r="10"/>
      <circle cx="790" cy="267" r="10"/>
      <path d="M752 267l15-20h20l-3 20"/>
      <path d="M767 247l7 20"/>
      <path d="M762 244h10"/>
      <path d="M784 243l8 7"/>
      <circle cx="815" cy="238" r="5" fill="#22c55e" stroke="none"/>
      <path d="M815 244v16"/>
      <path d="M815 248l-7 6m7-6l7 4"/>
      <path d="M815 260l-6 12m6-12l7 10"/>
    </g>

    <text x="662" y="358" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Cyclistes, cyclomoteurs</text>
    <text x="662" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">à deux roues autorisés</text>
    <text x="662" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">sur la piste cyclable,</text>
    <text x="662" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">et piétons.</text>
    <text x="662" y="446" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">Les voitures ne suivent pas ce feu.</text>
  </g>

  <text x="40" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Rouge : rester. Vert : s'engager. Vert clignotant : fin indicative de l'autorisation.</text>
</svg>
