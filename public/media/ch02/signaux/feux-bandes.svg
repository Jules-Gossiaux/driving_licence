<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="titre bandes">
  <title id="titre">Croix rouge, flèche verte et flèche jaune-orange au-dessus des bandes</title>
  <desc id="bandes">La croix rouge interdit le sens sur la bande. La flèche verte vers le bas autorise le sens sur la bande. La flèche jaune-orange oblique oblige à quitter la bande dans la direction indiquée. Ces feux ne règlent pas la priorité et ne permettent pas de franchir le carrefour.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Les feux au-dessus des bandes</text>
  <text x="40" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Ils indiquent le sens autorisé sur chaque bande, pas la priorité.</text>

  <g>
    <rect x="40" y="108" width="280" height="344" rx="18" fill="#ffffff" stroke="#fecaca"/>
    <rect x="40" y="108" width="280" height="8" rx="4" fill="#dc2626"/>
    <text x="62" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Croix rouge</text>
    <text x="62" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b91c1c">Bande fermée</text>

    <rect x="130" y="196" width="100" height="100" rx="12" fill="#1f2937"/>
    <rect x="138" y="204" width="84" height="84" rx="8" fill="#111827"/>
    <g stroke="#dc2626" stroke-width="16" stroke-linecap="round">
      <path d="M154 220l52 52"/>
      <path d="M206 220l-52 52"/>
    </g>

    <text x="62" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Sens interdit sur</text>
    <text x="62" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">cette bande.</text>
    <text x="62" y="404" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">Cherchez une autre bande</text>
    <text x="62" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">en toute sécurité.</text>
  </g>

  <g>
    <rect x="340" y="108" width="280" height="344" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="340" y="108" width="280" height="8" rx="4" fill="#16a34a"/>
    <text x="362" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Flèche verte</text>
    <text x="362" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#15803d">Bande ouverte</text>

    <rect x="430" y="196" width="100" height="100" rx="12" fill="#1f2937"/>
    <rect x="438" y="204" width="84" height="84" rx="8" fill="#111827"/>
    <path d="M468 214h24v34h18l-30 32-30-32h18z" fill="#22c55e"/>

    <text x="362" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Sens autorisé sur</text>
    <text x="362" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">cette bande.</text>
    <text x="362" y="404" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">La flèche indique la bande,</text>
    <text x="362" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">pas la priorité au carrefour.</text>
  </g>

  <g>
    <rect x="640" y="108" width="280" height="344" rx="18" fill="#ffffff" stroke="#fde68a"/>
    <rect x="640" y="108" width="280" height="8" rx="4" fill="#f59e0b"/>
    <text x="662" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Flèche orange</text>
    <text x="662" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b45309">Quitter la bande</text>

    <rect x="730" y="196" width="100" height="100" rx="12" fill="#1f2937"/>
    <rect x="738" y="204" width="84" height="84" rx="8" fill="#111827"/>
    <g transform="rotate(45 780 246)">
      <path d="M768 214h24v34h18l-30 32-30-32h18z" fill="#f59e0b"/>
    </g>

    <text x="662" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Quitter la bande dans</text>
    <text x="662" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">la direction indiquée,</text>
    <text x="662" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">dès que possible.</text>
    <text x="662" y="426" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">La flèche peut clignoter.</text>
  </g>

  <text x="40" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">À l'approche d'un carrefour, ces feux ne vous autorisent pas à le franchir.</text>
</svg>
