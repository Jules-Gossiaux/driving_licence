<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="titre clignotants">
  <title id="titre">Orange clignotant, feux rouges alternés et lumière blanche lunaire</title>
  <desc id="clignotants">Un feu jaune-orange clignotant autorise à avancer avec prudence supplémentaire sans modifier les règles de priorité. Deux feux rouges alternés à un passage à niveau interdisent le franchissement. Une lumière blanche lunaire clignotante autorise le franchissement.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Les feux clignotants</text>
  <text x="40" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Le clignotement change la consigne : prudence, arrêt ou autorisation.</text>

  <g>
    <rect x="40" y="108" width="280" height="344" rx="18" fill="#ffffff" stroke="#fde68a"/>
    <rect x="40" y="108" width="280" height="8" rx="4" fill="#f59e0b"/>
    <text x="62" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Orange clignotant</text>
    <text x="62" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b45309">Prudence renforcée</text>

    <circle cx="180" cy="245" r="38" fill="#f59e0b"/>
    <circle cx="169" cy="234" r="11" fill="#fcd34d" opacity="0.6"/>
    <g stroke="#f59e0b" stroke-width="7" stroke-linecap="round">
      <path d="M180 178v-18"/>
      <path d="M180 312v18"/>
      <path d="M113 245h-18"/>
      <path d="M247 245h18"/>
      <path d="M133 198l-13-13"/>
      <path d="M227 198l13-13"/>
      <path d="M133 292l-13 13"/>
      <path d="M227 292l13 13"/>
    </g>

    <text x="62" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Avancer avec prudence</text>
    <text x="62" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">supplémentaire.</text>
    <text x="62" y="408" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Les règles de priorité</text>
    <text x="62" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">ne changent pas.</text>
  </g>

  <g>
    <rect x="340" y="108" width="280" height="344" rx="18" fill="#ffffff" stroke="#fecaca"/>
    <rect x="340" y="108" width="280" height="8" rx="4" fill="#dc2626"/>
    <text x="362" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Passage à niveau</text>
    <text x="362" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b91c1c">Deux feux rouges alternés</text>

    <rect x="392" y="205" width="180" height="90" rx="16" fill="#1f2937"/>
    <circle cx="437" cy="250" r="26" fill="#dc2626"/>
    <circle cx="527" cy="250" r="26" fill="#dc2626"/>
    <circle cx="429" cy="242" r="8" fill="#f87171" opacity="0.5"/>
    <circle cx="519" cy="242" r="8" fill="#f87171" opacity="0.5"/>
    <path d="M410 196l-14-14 6 14-6 14z" fill="#dc2626"/>
    <path d="M554 304l14 14-6-14 6-14z" fill="#dc2626"/>

    <text x="362" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Arrêt obligatoire, même</text>
    <text x="362" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">si la barrière est levée</text>
    <text x="362" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">ou si aucun train n'est</text>
    <text x="362" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">visible.</text>
    <text x="362" y="442" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">Le feu prime sur l'apparence de la voie.</text>
  </g>

  <g>
    <rect x="640" y="108" width="280" height="344" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="640" y="108" width="280" height="8" rx="4" fill="#64748b"/>
    <text x="662" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Lumière blanche</text>
    <text x="662" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">Feu lunaire clignotant</text>

    <rect x="700" y="195" width="160" height="120" rx="18" fill="#1f2937"/>
    <rect x="712" y="207" width="136" height="96" rx="10" fill="#111827"/>
    <circle cx="780" cy="255" r="36" fill="#f8fafc"/>
    <circle cx="769" cy="244" r="10" fill="#ffffff"/>
    <g stroke="#f8fafc" stroke-width="7" stroke-linecap="round">
      <path d="M780 194v-12"/>
      <path d="M780 316v12"/>
      <path d="M719 255h-12"/>
      <path d="M841 255h12"/>
    </g>

    <text x="662" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Franchissement autorisé.</text>
    <text x="662" y="386" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">La lumière blanche clignotante</text>
    <text x="662" y="404" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">autorise le passage au passage</text>
    <text x="662" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">à niveau lorsque la signalisation</text>
    <text x="662" y="440" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">lumineuse fonctionne.</text>
  </g>

  <text x="40" y="500" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#b45309">Orange fixe : arrêt. Orange clignotant : prudence.</text>
</svg>
