<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">Marquage en damier</title>
  <desc id="desc">Vue de dessus d'une chaussée où un damier de carrés blancs délimite l'espace central réservé aux transports en commun, entre deux lignes blanches continues.</desc>
  <defs>
    <pattern id="checker" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="16" height="16" fill="#f8fafc"/>
      <rect x="16" y="16" width="16" height="16" fill="#f8fafc"/>
    </pattern>
  </defs>
  <rect width="480" height="360" fill="#f8fafc"/>
  <rect x="70" y="0" width="30" height="360" fill="#e2e8f0"/>
  <rect x="380" y="0" width="30" height="360" fill="#e2e8f0"/>
  <rect x="100" y="0" width="280" height="360" fill="#334155"/>

  <line x1="170" y1="0" x2="170" y2="360" stroke="#f8fafc" stroke-width="7"/>
  <line x1="310" y1="0" x2="310" y2="360" stroke="#f8fafc" stroke-width="7"/>

  <rect x="176" y="104" width="128" height="176" fill="url(#checker)"/>

  <g>
    <rect x="211" y="38" width="58" height="48" rx="8" fill="#f8fafc"/>
    <rect x="219" y="46" width="18" height="14" rx="2" fill="#334155"/>
    <rect x="243" y="46" width="18" height="14" rx="2" fill="#334155"/>
    <rect x="219" y="68" width="42" height="6" rx="2" fill="#334155"/>
    <rect x="217" y="84" width="12" height="8" rx="2" fill="#0f172a"/>
    <rect x="251" y="84" width="12" height="8" rx="2" fill="#0f172a"/>
  </g>

  <text x="240" y="332" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Espace réservé aux transports en commun</text>
</svg>
