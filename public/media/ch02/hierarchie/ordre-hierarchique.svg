<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="titre-hierarchie desc-hierarchie">
  <title id="titre-hierarchie">L'ordre hiérarchique des signaux</title>
  <desc id="desc-hierarchie">Quatre niveaux, du plus fort au plus faible : l'agent qualifié, les feux lumineux, la signalisation routière, puis les règles de circulation.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="40" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">L'ordre hiérarchique</text>
  <text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Quand deux signaux se contredisent, celui du niveau le plus haut l'emporte.</text>

  <g>
    <rect x="40" y="96" width="880" height="86" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="96" width="8" height="86" rx="4" fill="#dc2626"/>
    <circle cx="78" cy="139" r="19" fill="#dc2626"/>
    <text x="78" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">1</text>
    <circle cx="134" cy="120" r="7" fill="#0f172a"/>
    <path d="M134 129v19M118 136h32M134 148l-10 16M134 148l10 16" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <text x="176" y="132" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Agent qualifié</text>
    <text x="176" y="157" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Ses gestes et sa position priment sur les feux, les panneaux et les règles.</text>
  </g>

  <g>
    <rect x="40" y="192" width="880" height="86" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="192" width="8" height="86" rx="4" fill="#d97706"/>
    <circle cx="78" cy="235" r="19" fill="#d97706"/>
    <text x="78" y="241" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">2</text>
    <rect x="122" y="210" width="24" height="58" rx="6" fill="#1f2937"/>
    <circle cx="134" cy="222" r="5.5" fill="#dc2626"/>
    <circle cx="134" cy="239" r="5.5" fill="#f59e0b"/>
    <circle cx="134" cy="256" r="5.5" fill="#16a34a"/>
    <text x="176" y="228" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Feux lumineux</text>
    <text x="176" y="253" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Ils neutralisent les panneaux de priorité, avec quelques exceptions.</text>
  </g>

  <g>
    <rect x="40" y="288" width="880" height="86" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="288" width="8" height="86" rx="4" fill="#2563eb"/>
    <circle cx="78" cy="331" r="19" fill="#2563eb"/>
    <text x="78" y="337" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">3</text>
    <circle cx="128" cy="326" r="14" fill="#ffffff" stroke="#c1121f" stroke-width="5"/>
    <path d="M120 326h16" stroke="#c1121f" stroke-width="4" stroke-linecap="round"/>
    <path d="M112 352h44" stroke="#64748b" stroke-width="4" stroke-dasharray="8 7" stroke-linecap="round"/>
    <text x="176" y="324" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Signalisation routière</text>
    <text x="176" y="349" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Panneaux et marquages : le panneau explicite tranche en cas de contradiction.</text>
  </g>

  <g>
    <rect x="40" y="384" width="880" height="86" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="384" width="8" height="86" rx="4" fill="#475569"/>
    <circle cx="78" cy="427" r="19" fill="#475569"/>
    <text x="78" y="433" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">4</text>
    <rect x="128" y="406" width="12" height="50" fill="#cbd5e1"/>
    <rect x="110" y="424" width="48" height="12" fill="#cbd5e1"/>
    <rect x="146" y="420" width="13" height="8" rx="2" fill="#334155"/>
    <path d="M154 430h-24" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M134 425l-7 5 7 5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="176" y="420" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Règles de circulation</text>
    <text x="176" y="445" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Priorité à droite et autres règles générales, quand aucun signal ne tranche.</text>
  </g>

  <text x="40" y="512" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Orange clignotant : le feu ne règle pas la priorité ; les panneaux et les règles reprennent la main.</text>
</svg>
