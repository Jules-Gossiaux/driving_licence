- id: securotheque-b22-b23
  title: "Signaux relatifs à la priorité B22 et B23 dans un carrefour à feux"
  kind: official
  publisher: "Sécurothèque — Service public de Wallonie"
  url: https://securotheque.wallonie.be/e-amenagements-usagers-et-vehicules/velos/amenagements-cyclables/signaux-relatifs-a-la-priorite-b22-et-b23-dans-un-carrefour-a-feux
  accessedAt: 2026-10-20T00:00:00Z
  rights: external_reference
  note: >-
    Description officielle wallonne : le B22 autorise les cyclistes et les
    conducteurs de speed pedelecs à franchir le feu pour tourner à droite, le
    B23 pour aller tout droit, lorsque le feu est rouge ou orange et à condition
    de céder le passage.

