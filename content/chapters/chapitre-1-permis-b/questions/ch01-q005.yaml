explanation: >-
  Avec une remorque de plus de 750 kg, le code 96 s'applique lorsque la MMA de
  l'ensemble est supérieure à 3 500 kg et ne dépasse pas 4 250 kg. À 4 000 kg,
  c'est donc le permis B avec code 96 qui est requis.
