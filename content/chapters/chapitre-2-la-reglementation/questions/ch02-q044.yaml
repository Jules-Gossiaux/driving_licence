prompt: Un conducteur détient son permis B depuis moins de deux ans. Il commet une infraction pouvant donner lieu à une déchéance avec un véhicule à moteur. Que prévoit la loi ?
options:
  - id: a
    label: La déchéance est obligatoire.
  - id: b
    label: La déchéance est seulement possible.
  - id: c
    label: Il reçoit un simple avertissement.
  - id: d
    label: Seule une amende est prévue.
